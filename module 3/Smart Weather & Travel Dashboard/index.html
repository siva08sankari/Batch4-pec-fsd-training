
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Weather & Travel Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Smart Weather & Travel Dashboard</h1>

        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>

        <p id="error"></p>

        <div id="weatherCard">

            <h2 id="cityName">Search for a city</h2>

            <div id="weatherIcon">
                ☀️
            </div>

            <h3 id="temperature">-- °C</h3>

            <p id="condition">Weather condition</p>

            <div class="details">

                <p>
                    💧 Humidity:
                    <span id="humidity">--</span>
                </p>

                <p>
                    💨 Wind:
                    <span id="wind">--</span>
                </p>

            </div>

        </div>

        <div id="travelCard">

            <h2>✈️ Travel Suggestion</h2>

            <p id="suggestion">
                Search for a city to get travel suggestions.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
