<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Personal Expense Calculator</h1>

        <!-- Income -->

        <div class="card">

            <h2>Income Details</h2>

            <input
                type="number"
                id="income"
                placeholder="Enter monthly income"
            >

        </div>


        <!-- Expense -->

        <div class="card">

            <h2>Add Expense</h2>

            <input
                type="text"
                id="expenseName"
                placeholder="Expense name"
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Expense amount"
            >

            <select id="category">

                <option value="">
                    Select Category
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Others">
                    Others
                </option>

            </select>

            <button onclick="addExpense()">
                Add Expense
            </button>

            <p id="error"></p>

        </div>


        <!-- Expense List -->

        <div class="card">

            <h2>Expense Details</h2>

            <table>

                <thead>

                    <tr>
                        <th>Expense</th>
                        <th>Amount</th>
                        <th>Category</th>
                    </tr>

                </thead>

                <tbody id="expenseList">

                </tbody>

            </table>

        </div>


        <!-- Summary -->

        <div class="card summary">

            <h2>Summary Report</h2>

            <p>
                Total Income:
                ₹<span id="totalIncome">0</span>
            </p>

            <p>
                Total Expenses:
                ₹<span id="totalExpense">0</span>
            </p>

            <p>
                Savings:
                ₹<span id="savings">0</span>
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
